services:
  - type: web
    name: revora-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: FALKORDB_URL
        sync: false
      - key: FALKORDB_GRAPH
        value: revora
      - key: REVORA_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: PORT
        value: 8000
