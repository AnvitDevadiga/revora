name: Backend checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check app tests --select E9,F63,F7,F82
        working-directory: backend
      - run: python -m compileall -q app tests
        working-directory: backend
      - run: pytest -q tests
        working-directory: backend
        env:
          APP_ENV: test
          PYTHONPATH: .
  graph-integration:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb@sha256:e2765e207e5ba4ee90e47ed31eb7491ad6dd3d42241c326e429375c02ad9882f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python tests/integration_runtime.py
        working-directory: backend
        env:
          FALKORDB_URL: falkor://127.0.0.1:6379
          FALKORDB_GRAPH: revora-ci
          APP_ENV: test
          PYTHONPATH: .
      - run: python tests/integration_lab.py
        working-directory: backend
        env:
          FALKORDB_URL: falkor://127.0.0.1:6379
          FALKORDB_GRAPH: revora-ci
          APP_ENV: test
          PYTHONPATH: .
      - run: python tests/integration_submission.py
        working-directory: backend
        env:
          FALKORDB_URL: falkor://127.0.0.1:6379
          FALKORDB_GRAPH: revora-ci
          APP_ENV: test
          PYTHONPATH: .
