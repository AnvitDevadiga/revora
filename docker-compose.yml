services:
  falkordb:
    image: falkordb/falkordb@sha256:e2765e207e5ba4ee90e47ed31eb7491ad6dd3d42241c326e429375c02ad9882f
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - revora-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      FALKORDB_URL: falkor://falkordb:6379
      FALKORDB_GRAPH: revora
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PORT: "8000"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GROQ_PLANNER_MODEL: "${GROQ_PLANNER_MODEL:-}"
      REVORA_API_KEY: "${REVORA_API_KEY:-}"
      REVORA_SERVICE_NAME: "${REVORA_SERVICE_NAME:-revora-demo}"
      REVORA_STABLE_URL: "${REVORA_STABLE_URL:-}"
      REVORA_CANDIDATE_URL: "${REVORA_CANDIDATE_URL:-}"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  revora-data:
